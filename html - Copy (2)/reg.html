      <body>
      	<a href="login.html">login</a>

	  <h2 style="color:red; text-align: center;background: yellow;">This is registration page</h2>
	 
	     <fieldset>
	     	<legend>Application Form</legend>
	     	<form>
	    Name:
		<input type="text" name="name"placeholder="Enter your name"><br><br>
		Email:
		<input type="text" name="mail"placeholder="Enter your email"><br><br>
		Password:
		<input type="password" name="pwd"placeholder="Enter your password"><br><br>
		gender:
		<input type="radio"name="g">Male
		<input type="radio"name="g">Female
		<input type="radio"name="g">Others<br><br>
		Depertment:
		<select name="dept">
			<option>Select Dept</option>
			<option>CSE</option>
			<option>Electronics</option>
			<option>EEE</option>
			<option>Civil</option>
		</select><br><br>
		colors:
		<input type="checkbox"name="c1">Red
		<input type="checkbox"name="c2">Orange
		<input type="checkbox"name="c3">Yellow<br><br>
		<input type="submit" name="registration">
	  
	  </form>

	     </fieldset>
	 </body>





</html>
