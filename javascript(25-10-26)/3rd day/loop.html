<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
       .namec{
        color: blueviolet;
        border: 2px solid black;
        border-radius: 20%;
        padding: 10px 10px;
        text-align: center;
       }
       #container{
        display: flex;
        flex-direction: row;
       }
      
    </style>
</head>


<body>
    <div id="container">

    </div>
    <script>
        let container=document.getElementById("container")
        let name = ["Hasan", "Mizan", "Talha", "Nayeem"]
        
       
        for (x = 0; x <name.length; x++) {
            let d=document.createElement("div")
            d.className="namec"

            let head=document.createElement("span")
            head.textContent=name[x]

            d.appendChild(head)
            container.appendChild(d)           
        }
    </script>

</body>

</html>
